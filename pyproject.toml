[project]
name = "hr-automation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "langchain>=1.4.8",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "markitdown[docx,pdf]>=0.1.9",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

# Tells the editor that frontend/ is an import folder, like Streamlit does when it runs
[tool.pyrefly]
search-path = [".", "frontend"]
