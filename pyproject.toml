[project]
name = "hr-automation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "certifi>=2026.10.23",
    "elevenlabs>=2.76.0",
    "jinja2>=3.1.6",
    "langchain>=1.4.8",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "libsql>=0.1.11",
    "markitdown[docx,pdf]>=0.1.9",
    "portion>=2.6.3",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "redmail>=0.6.0",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.66.1",
]

# Tells the editor that frontend/ is an import folder, like Streamlit does when it runs
[tool.pyrefly]
search-path = [".", "frontend"]
